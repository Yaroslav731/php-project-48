# Название workflow, которое отображается во вкладке Actions на GitHub
name: Project CI & Sonar Analysis

# Триггеры: запуск при каждом push или pull request в основные ветки
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build, Test and Sonar Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий. 
      # Параметр fetch-depth: 0 скачивает всю историю коммитов — это критично для корректной работы Sonar.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Настраиваем PHP (так как у тебя php-project-48)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug

      # 3. Устанавливаем зависимости Composer
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # 4. Запускаем линтер (если используешь make lint или vendor/bin/phpcs)
      - name: Run Linter
        run: make lint   # Если у тебя другая команда (например, npm run lint), укажи её здесь

      # 5. Запускаем тесты
      - name: Run Tests
        run: make test   # Или vendor/bin/phpunit / npm test

      # 6. Сканирование SonarCloud
      # Берёт настройки из sonar-project.properties и секрет SONAR_TOKEN из GitHub Secrets
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Автоматический токен от самого GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Токен, который мы добавили в Secrets
